name: Build RizGo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout RizGo
        uses: actions/checkout@v4

      - name: Setup Gluon GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libgl-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libxtst-dev \
            zlib1g-dev

      - name: Check environment and set permissions
        run: |
          chmod +x mvnw
          echo "JAVA_HOME=$JAVA_HOME"
          echo "GRAALVM_HOME=$GRAALVM_HOME"
          java -version
          # Use standard path referencing provided by GraalVM action
          native-image --version
          ./mvnw -version

      - name: Compile RizGo
        run: ./mvnw clean compile

      - name: Build Android APK
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          ./mvnw -Pandroid clean gluonfx:build gluonfx:package
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Find generated APK
        run: |
          echo "Generated Android files:"
          find target/gluonfx/aarch64-android/gvm \
            -type f \( -name "*.apk" -o -name "*.aab" \) -print || echo "No APK/AAB found."

      - name: Upload RizGo APK
        uses: actions/upload-artifact@v4
        with:
          name: RizGo-Android
          path: |
            target/gluonfx/aarch64-android/gvm/*.apk
            target/gluonfx/aarch64-android/gvm/*.aab
          if-no-files-found: error