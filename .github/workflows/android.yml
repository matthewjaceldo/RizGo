name: Build RizGo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RizGo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Compile RizGo
        run: mvn clean compile

      - name: Build Android APK
        run: mvn -Pandroid gluonfx:build gluonfx:package

      - name: Find generated APK
        run: |
          find target -type f -name "*.apk" -print

      - name: Upload RizGo APK
        uses: actions/upload-artifact@v4
        with:
          name: RizGo-Android
          path: target/**/*.apk
          if-no-files-found: error
